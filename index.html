  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Interactive Minimal Particle Network in Sand & Electric Blue
    const InteractiveCanvas = () => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const handleResize = () => {
          if (!canvas) return;
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        const mouse = { x: width / 2, y: height / 2, radius: 140 };
        const handleMouseMove = (e) => {
          mouse.x = e.clientX;
          mouse.y = e.clientY;
        };
        window.addEventListener('mousemove', handleMouseMove);

        const particles = [];
        const count = Math.min(width > 768 ? 48 : 20, 60);

        for (let i = 0; i < count; i++) {
          particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: Math.random() * 1.6 + 0.6,
            color: Math.random() > 0.8 ? '#0062FF' : '#EAE3D2',
            vx: (Math.random() - 0.5) * 0.35,
            vy: (Math.random() - 0.5) * 0.35,
            baseAlpha: Math.random() * 0.35 + 0.15
          });
        }

        const render = () => {
          ctx.clearRect(0, 0, width, height);

          // Subtle connection traces
          for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
              const dx = particles[i].x - particles[j].x;
              const dy = particles[i].y - particles[j].y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < 110) {
                const alpha = (1 - dist / 110) * 0.12;
                ctx.beginPath();
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.strokeStyle = `rgba(234, 227, 210, ${alpha})`;
                ctx.lineWidth = 0.65;
                ctx.stroke();
              }
            }
          }

          particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;

            if (p.x < 0 || p.x > width) p.vx *= -1;
            if (p.y < 0 || p.y > height) p.vy *= -1;

            const dx = mouse.x - p.x;
            const dy = mouse.y - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < mouse.radius) {
              const force = (mouse.radius - dist) / mouse.radius;
              p.x -= (dx / dist) * force * 0.9;
              p.y -= (dy / dist) * force * 0.9;
            }

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.baseAlpha;
            ctx.fill();
            ctx.globalAlpha = 1;
          });

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('mousemove', handleMouseMove);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return <canvas ref={canvasRef} className="absolute inset-0 pointer-events-none z-0 opacity-40" />;
    };

    // Hero Section with Clean Typography & Real-time Live Simulator Widget
    const Hero = () => {
      const [activeQuestionIndex, setActiveQuestionIndex] = useState(0);
      const [userAnswer, setUserAnswer] = useState("");
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [evaluationResult, setEvaluationResult] = useState(null);

      const sampleQuestions = [
        {
          id: 1,
          topic: "RAG Pipeline & Embeddings",
          question: "How does your system prevent hallucination during knowledge retrieval from student project documentation?",
          sampleGood: "We implement cross-encoder reranking after dense vector retrieval, combined with strict context window grounding and temperature=0.1."
        },
        {
          id: 2,
          topic: "Scalability & Vector DB",
          question: "Why did you choose your specific indexing scheme over traditional relational full-text search?",
          sampleGood: "Traditional BM25 matches exact lexical tokens but fails on conceptual synonyms like 'latency' vs 'response delay'. Vector embeddings preserve semantic intent."
        },
        {
          id: 3,
          topic: "Adaptive Difficulty Engine",
          question: "If a student answers poorly across initial questions, how does the system adjust the viva path?",
          sampleGood: "The state machine steps back from synthesis/evaluation questions to foundational comprehension, flagging that node in the knowledge gap ledger."
        }
      ];

      const currentQ = sampleQuestions[activeQuestionIndex];

      const handleEvaluate = () => {
        if (!userAnswer.trim()) return;
        setIsAnalyzing(true);
        setTimeout(() => {
          setIsAnalyzing(false);
          const wordCount = userAnswer.trim().split(/\s+/).length;
          const score = Math.min(95, Math.max(70, Math.floor(75 + (wordCount * 0.75))));
          setEvaluationResult({
            score: score,
            clarity: score > 85 ? "Authoritative" : "Satisfactory",
            feedback: score > 85 
              ? "Crisp, concise technical articulation. Examiner confidence rating: 9.4/10."
              : "Valid conceptual foundation. Recommendation: Bolster exact latency and resource trade-offs.",
            detectedGaps: score > 85 ? [] : ["Quantitative boundary metrics", "Failure domain recovery plan"]
          });
        }, 1000);
      };

        setUserAnswer(currentQ.sampleGood);
      };

                    </svg>
                  </a>

                    href="#loop" 
                    className="w-full sm:w-auto px-5 py-3 rounded-lg text-xs font-semibold text-sand-200 hover:text-white bg-charcoal-850 hover:bg-charcoal-800 border border-sand-200/10 transition-all flex items-center justify-center gap-2"
                  >

                  </div>

                    <div className="text-[11px] text-sand-muted font-medium mt-0.5">Retrieval Engine</div>

                  </div>

                {/* Terminal Card */}

                  {/* Terminal Header */}

                      <span className="w-2.5 h-2.5 rounded-full bg-charcoal-700 inline-block"></span>
                      <span className="w-2.5 h-2.5 rounded-full bg-charcoal-700 inline-block"></span>
                      <span className="w-2.5 h-2.5 rounded-full bg-charcoal-700 inline-block"></span>

                    </div>

                      <span className="text-[10px] font-mono text-sand-300 uppercase tracking-wider">Active Viva</span>
                    </div>
                  </div>

                    <div className="flex items-center justify-between text-[11px] text-electric-light font-mono mb-1.5">

                    <div className="flex items-center gap-1">

                        <button
                          key={q.id}
                          onClick={() => {
                            setActiveQuestionIndex(idx);
                            setUserAnswer("");
                            setEvaluationResult(null);

                          className={`w-6 h-6 rounded text-xs font-mono font-medium transition-all ${
                            activeQuestionIndex === idx
                              ? 'bg-sand-200 text-charcoal-950 font-bold'
                              : 'bg-charcoal-800 text-sand-muted hover:text-sand-200'

                        >
                          {idx + 1}
                        </button>

                          ? 'bg-charcoal-800 text-sand-muted/40 cursor-not-allowed'
                          : 'bg-electric-blue hover:bg-electric-blueHover text-white shadow-sm'

                    >
